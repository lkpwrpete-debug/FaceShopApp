name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute and Build Correct Module
      run: |
        chmod +x gradlew
        # สั่งบิลด์ระบุ Module :app โดยตรงจาก Root
        ./gradlew :app:assembleDebug --no-daemon

    - name: Extract and Save APK
      run: |
        mkdir -p final_apk_output
        find . -name "*.apk" -type f -exec cp {} final_apk_output/ \;

    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceShop-Calculator
        path: final_apk_output/*.apk
