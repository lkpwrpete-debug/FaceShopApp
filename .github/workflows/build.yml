name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build Android App Directly
      run: |
        # ค้นหาตำแหน่งโฟลเดอร์จริงที่มี build.gradle หรือ app/build.gradle
        PROJECT_DIR=$(find . -name "build.gradle" -not -path "*/.*" | xargs dirname | head -n 1)
        echo "Found Android project at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew || chmod +x ../gradlew || true
        
        # ลองรันบิลด์จากตำแหน่งที่เจอ
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug --no-daemon
        elif [ -f "../gradlew" ]; then
          ../gradlew assembleDebug --no-daemon
        else
          gradlew assembleDebug --no-daemon
        fi

    - name: Extract and Save APK
      run: |
        mkdir -p final_apk_output
        find . -name "*.apk" -type f -exec cp {} final_apk_output/ \;

    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceShop-Calculator
        path: final_apk_output/*.apk
