name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Build APK inside nested folder
      run: |
        cd FaceShopApp
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Copy APKs to flat folder
      run: |
        mkdir -p output_apk
        find . -name "*.apk" -exec cp {} output_apk/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceShop-Calculator
        path: output_apk/*.apk
