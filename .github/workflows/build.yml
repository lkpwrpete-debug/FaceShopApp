name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Ultimate Smart Build & APK Extract
      run: |
        echo "=== 1. Searching for gradlew location ==="
        GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" | head -n 1)
        GRADLE_DIR=$(dirname "$GRADLEW_PATH")
        
        echo "Found gradlew at: $GRADLEW_PATH"
        cd "$GRADLE_DIR"
        
        echo "=== 2. Granting Executable Permissions ==="
        chmod +x gradlew
        
        echo "=== 3. Building Debug APK ==="
        ./gradlew assembleDebug --no-daemon
        
        echo "=== 4. Collecting generated APKs ==="
        cd $GITHUB_WORKSPACE
        mkdir -p final_apk_output
        find . -name "*.apk" -type f -exec cp {} final_apk_output/ \;

    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceShop-Calculator
        path: final_apk_output/*.apk
