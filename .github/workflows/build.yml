name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Debug and Scan Project Structure
      run: |
        echo "=== CURRENT DIRECTORY ==="
        pwd
        echo "=== LIST ALL FILES & FOLDERS ==="
        find . -maxdepth 3 -not -path '*/.*'
        
        echo "=== FIND BUILD.GRADLE ==="
        TARGET_BUILD=$(find . -name "build.gradle" -not -path '*/.*' | head -n 1)
        echo "Target build.gradle found at: $TARGET_BUILD"
        
        DIR_PATH=$(dirname "$TARGET_BUILD")
        cd "$DIR_PATH"
        
        echo "=== RUNNING GRADLE BUILD ==="
        # ค้นหา gradlew ที่ใกล้ที่สุด
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "../gradlew" ]; then
          chmod +x ../gradlew
          ../gradlew assembleDebug --no-daemon
        else
          # ใช้ gradle กลางถ้าไม่มี gradlew
          gradle assembleDebug --no-daemon
        fi

    - name: Extract and Save APK
      run: |
        mkdir -p final_apk_output
        find . -name "*.apk" -type f -exec cp {} final_apk_output/ \;

    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FaceShop-Calculator
        path: final_apk_output/*.apk
